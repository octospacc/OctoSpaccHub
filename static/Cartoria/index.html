<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Cartoria/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A personal archive for notes, bookmarks, and files.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cartoria">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme color follows prefers-color-scheme for the browser UI chrome -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF8F6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1A110F">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cartoria</title>
  <link rel="manifest" href="manifest.json">

    <!--
    Pre-Flutter background. The HTML body is what the user sees between
    the network request for flutter_bootstrap.js and the first Flutter
    frame (~200-800ms). Without this, dark-mode users see a white flash
    on every reload. Values chosen to match ColorScheme.surface of the
    generated Material 3 palette.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #FFF8F6;
      color: #1C1B1F;
      height: 100%;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #1A110F;
        color: #E6E1E5;
      }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
